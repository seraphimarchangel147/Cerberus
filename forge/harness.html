<!doctype html>
<html><head><meta charset="utf-8"><title>FORGE rig</title>
<style>html,body{margin:0;background:#120808;} #pixel{image-rendering:pixelated;}</style>
</head><body>
<canvas id="pixel" width="480" height="480"></canvas>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ── FORGE v6: VOXEL pipeline. The rigged model (primitives + joint
      hierarchy) is the animation source; every frame it is voxelized —
      triangles sampled onto a 3D grid, drawn as instanced cubes. One
      unified cube language, real lighting, zero image-gen. ── */

const LW = 200, LH = 200;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(LW, LH, false);
renderer.setPixelRatio(1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6e3a2e);

const cam = new THREE.OrthographicCamera(-3.0, 3.0, 3.0, -3.0, 0.1, 60);
cam.position.set(7.4, 3.1, 2.2);
cam.lookAt(0, 1.25, 0);

const gradTex = new THREE.DataTexture(
  new Uint8Array([70,70,70,255, 135,135,135,255, 200,200,200,255, 255,255,255,255]),
  4, 1, THREE.RGBAFormat);
gradTex.needsUpdate = true;
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter;

const toon = (color, opts = {}) =>
  new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradTex }, opts));

const M = {
  body:   toon(0x6f8cab),
  bodyFr: toon(0x89a7c4),
  bodyDk: toon(0x455a73),
  armor:  toon(0xa8bfd2),
  armorDk:toon(0x6b7f94),
  dark:   toon(0x161b23),
  claw:   toon(0x8fe9ff),
  eye:    new THREE.MeshBasicMaterial({ color: 0xaef6ff }),
  orb:    new THREE.MeshBasicMaterial({ color: 0x46d6ff }),
  crystal:new THREE.MeshToonMaterial({ color: 0x67ecff, emissive: 0x1899cc, emissiveIntensity: 1.2, gradientMap: gradTex }),
  outline:new THREE.MeshBasicMaterial({ color: 0x07090d, side: THREE.BackSide }),
  flameA: new THREE.MeshBasicMaterial({ color: 0x1a5cf0 }),
  flameB: new THREE.MeshBasicMaterial({ color: 0x64dcff }),
  ground: toon(0x2a1418),
};

/* ── everything animatable/model goes under sourceRoot; it is voxelized
      each frame and hidden from the final render (voxels replace it) ── */
const sourceRoot = new THREE.Group();
scene.add(sourceRoot);

/* outline helper (kept in source for silhouette thickness in voxel space) */
function outlined(mesh) {
  const o = new THREE.Mesh(mesh.geometry, M.outline);
  o.scale.setScalar(1.06);
  o.userData.isOutline = true;
  mesh.add(o);
  return mesh;
}
const O = outlined;

const rig = {};

/* ground pedestal + glow pool + shadow */
const ground = O(new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.25, 0.28, 24), M.ground));
ground.position.y = -0.14;
ground.userData.voxDens = 8;   /* thin cap fan needs dense sampling to fill solid */
sourceRoot.add(ground);
/* fire spill pool: scene-space radial gradient (not voxelized = no noise) */
const poolCanvas = document.createElement("canvas");
poolCanvas.width = poolCanvas.height = 64;
const plCtx = poolCanvas.getContext("2d");
const plGrad = plCtx.createRadialGradient(32, 32, 2, 32, 32, 32);
plGrad.addColorStop(0, "rgba(70,170,255,0.85)");
plGrad.addColorStop(0.55, "rgba(25,90,220,0.5)");
plGrad.addColorStop(1, "rgba(10,40,140,0)");
plCtx.fillStyle = plGrad;
plCtx.fillRect(0, 0, 64, 64);
const poolTex = new THREE.CanvasTexture(poolCanvas);
const glowPool = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4),
  new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false,
                                blending: THREE.AdditiveBlending }));
glowPool.rotation.x = -Math.PI / 2;
glowPool.position.set(0, 0.032, -0.9);
scene.add(glowPool);
rig.glowPool = glowPool;
/* contact shadow: radial-gradient disc so it reads as soft shadow, not noise */
const shCanvas = document.createElement("canvas");
shCanvas.width = shCanvas.height = 64;
const shCtx = shCanvas.getContext("2d");
const shGrad = shCtx.createRadialGradient(32, 32, 4, 32, 32, 32);
shGrad.addColorStop(0, "rgba(8,4,10,0.85)");
shGrad.addColorStop(0.7, "rgba(8,4,10,0.5)");
shGrad.addColorStop(1, "rgba(8,4,10,0)");
shCtx.fillStyle = shGrad;
shCtx.fillRect(0, 0, 64, 64);
const shTex = new THREE.CanvasTexture(shCanvas);
shTex.magFilter = shTex.minFilter = THREE.LinearFilter;
const blobShadow = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4),
  new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false }));
blobShadow.rotation.x = -Math.PI / 2;
blobShadow.position.y = 0.031;
scene.add(blobShadow);   /* scene-space (not voxelized) = smooth soft shadow */

const root = new THREE.Group();
sourceRoot.add(root);
rig.root = root;

/* torso */
const chest = O(new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.1), M.body));
chest.position.set(0.35, 1.5, 0);
root.add(chest);
const hind = O(new THREE.Mesh(new THREE.BoxGeometry(1.35, 1.05, 1.05), M.bodyDk));
hind.position.set(-0.75, 1.38, 0);
root.add(hind);
const belly = O(new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.5, 0.75), M.armorDk));
belly.position.set(0.05, 0.98, 0);
root.add(belly);
for (let i = 0; i < 4; i++) {
  const sp = O(new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.42 - i * 0.05, 4), M.armor));
  sp.position.set(0.75 - i * 0.45, 2.12 - i * 0.04, 0);
  sp.rotation.z = -0.18;
  root.add(sp);
}
const orb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), M.orb);
orb.position.set(0.5, 1.62, 0.58);
root.add(orb);
const orbRing = O(new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.05, 8, 16), M.armor));
orbRing.position.copy(orb.position);
root.add(orbRing);
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const st = O(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.42, 4), M.armor));
  st.position.set(orb.position.x + Math.cos(a) * 0.44, orb.position.y + Math.sin(a) * 0.44, orb.position.z + 0.06);
  st.rotation.z = a - Math.PI / 2;
  root.add(st);
}

/* legs */
function makeLeg(x, z, name, front) {
  const hip = new THREE.Group();
  hip.position.set(x, 1.28, z);
  root.add(hip);
  const thigh = O(new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.62, 0.4), front ? M.bodyFr : M.bodyDk));
  thigh.position.y = -0.31;
  hip.add(thigh);
  const knee = new THREE.Group();
  knee.position.y = -0.62;
  hip.add(knee);
  const shin = O(new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.58, 0.28), M.dark));
  shin.position.y = -0.29;
  knee.add(shin);
  const greave = O(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.24, 0.32), M.armor));
  greave.position.y = -0.5;
  knee.add(greave);
  const paw = O(new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.15, 0.48), M.bodyDk));
  paw.position.set(0, -0.63, 0.07);
  knee.add(paw);
  for (const cx of [-0.11, 0.11]) {
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.24, 4), M.claw);
    claw.position.set(cx, -0.7, 0.36);
    claw.rotation.x = Math.PI / 2;
    knee.add(claw);
  }
  rig[name + "_hip"] = hip;
  rig[name + "_knee"] = knee;
}
makeLeg( 0.72,  0.54, "legFR", true);
makeLeg(-0.9,   0.52, "legFL", true);
makeLeg( 0.72, -0.52, "legBR", false);
makeLeg(-0.9,  -0.50, "legBL", false);

/* pauldrons */
for (const sx of [-1, 1]) {
  const pd = O(new THREE.Mesh(new THREE.SphereGeometry(0.34, 10, 8), M.armor));
  pd.position.set(0.55, 2.05, sx * 0.62);
  root.add(pd);
  for (let d = 0; d < 2; d++) {
    const drip = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 4), M.crystal);
    drip.position.set(0.55 + (d - 0.5) * 0.16, 1.72, sx * 0.62);
    drip.rotation.x = Math.PI;
    root.add(drip);
  }
}

/* heads */
function makeHead(angleY, tiltZ, len, name) {
  const neckPivot = new THREE.Group();
  neckPivot.position.set(0.5, 1.95, 0.28);
  neckPivot.rotation.y = angleY;
  root.add(neckPivot);
  const n1 = O(new THREE.Mesh(new THREE.BoxGeometry(0.34, len * 0.55, 0.34), M.body));
  n1.position.y = len * 0.28;
  neckPivot.add(n1);
  const headG = new THREE.Group();
  headG.position.set(-Math.sin(tiltZ) * len, Math.cos(tiltZ) * len, 0);
  headG.rotation.z = tiltZ;
  neckPivot.add(headG);
  headG.add(O(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.5), M.body)));
  const snout = O(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.34), M.bodyDk));
  snout.position.set(0, -0.07, 0.38);
  headG.add(snout);
  const jaw = O(new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.09, 0.3), M.dark));
  jaw.position.set(0, -0.2, 0.34);
  headG.add(jaw);
  for (const ex of [-0.16, 0.16]) {
    const ear = O(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.26, 4), M.armorDk));
    ear.position.set(ex, 0.3, -0.12);
    ear.rotation.z = ex > 0 ? -0.25 : 0.25;
    headG.add(ear);
  }
  const band = O(new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.21, 0.09, 8), M.armor));
  band.position.set(0, 0.26, 0.02);
  headG.add(band);
  for (let i = -1; i <= 1; i++) {
    const cs = O(new THREE.Mesh(new THREE.ConeGeometry(0.075, (i === 0 ? 0.42 : 0.3), 4), M.armor));
    cs.position.set(i * 0.13, 0.4, 0.02);
    headG.add(cs);
  }
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.05), M.orb);
  gem.position.set(0, 0.31, 0.2);
  headG.add(gem);
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.05, 0.06), M.dark);
  brow.position.set(0, 0.13, 0.25);
  headG.add(brow);
  for (const ex of [-0.13, 0.13]) {
    const eye = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.09, 0.04), M.eye);
    eye.position.set(ex, 0.06, 0.27);
    headG.add(eye);
  }
  for (const tx of [-0.09, 0, 0.09]) {
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.03), M.armor);
    tooth.position.set(tx, -0.17, 0.56);
    headG.add(tooth);
  }
  rig[name] = headG;
  rig[name + "_neck"] = neckPivot;
}
makeHead(-0.82, 0.52, 1.0, "headL");
makeHead( 0.0, 0.14, 1.35, "headC");
makeHead( 0.82, -0.52, 1.0, "headR");

/* tail */
const tailPivot = new THREE.Group();
tailPivot.position.set(-1.35, 1.6, 0);
root.add(tailPivot);
rig.tail = tailPivot;
let tailParent = tailPivot;
for (let i = 0; i < 6; i++) {
  const seg = O(new THREE.Mesh(new THREE.BoxGeometry(0.2 - i * 0.02, 0.2 - i * 0.02, 0.42), i % 2 ? M.dark : M.body));
  seg.position.z = -0.4;
  tailParent.add(seg);
  tailParent = seg;
}
const blade = O(new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.44, 4), M.crystal));
blade.position.z = -0.42;
blade.rotation.x = -Math.PI / 2;
tailParent.add(blade);

/* blue fire (gets voxelized too — voxel flames) */
const fireLight = new THREE.PointLight(0x3fb6ff, 30, 14, 1.6);
fireLight.position.set(0, 2.6, -2.2);
scene.add(fireLight);
rig.fireLight = fireLight;

/* additive glow halo so the fire reads as emitting light, not water */
const glowMat = new THREE.MeshBasicMaterial({ color: 0x2a7fff, transparent: true,
  opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const fireGlow = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.2), glowMat);
fireGlow.position.set(0, 2.0, -2.4);
fireGlow.lookAt(cam.position);
scene.add(fireGlow);
rig.fireGlow = fireGlow;

const tongues = [];
for (let i = 0; i < 8; i++) {
  const h = 1.1 + (i % 3) * 0.55;
  const tongue = new THREE.Mesh(new THREE.ConeGeometry(0.28 + (i % 2) * 0.15, h, 6), i % 2 ? M.flameB : M.flameA);
  tongue.position.set(-1.7 + i * 0.5, h / 2 + 0.05, -2.0 + (i % 2) * 0.3);
  sourceRoot.add(tongue);
  tongues.push(tongue);
}

scene.add(new THREE.AmbientLight(0x40303a, 1.35));
const key = new THREE.DirectionalLight(0xffe8d8, 1.15);
key.position.set(4, 6, 5);
scene.add(key);

/* ── VOXELIZER: sample every triangle onto a grid, emit instanced cubes ── */
const VOX = 0.095;
const BMIN = { x: -3.4, y: -0.5, z: -3.4 };
const BMAX = { x: 3.4, y: 4.4, z: 3.4 };
const NX = Math.ceil((BMAX.x - BMIN.x) / VOX);
const NY = Math.ceil((BMAX.y - BMIN.y) / VOX);
const NZ = Math.ceil((BMAX.z - BMIN.z) / VOX);
const MAXV = 150000;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(LW, LH), 0.4, 0.45, 0.62));

const voxMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(VOX * 1.02, VOX * 1.02, VOX * 1.02),   /* 2% overlap hides seams */
  new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: gradTex }),
  MAXV);
voxMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(voxMesh);

let vSeed = 12345;
function rndV() { vSeed = (vSeed * 1664525 + 1013904223) >>> 0; return vSeed / 4294967296; }

const _va = new THREE.Vector3(), _vb = new THREE.Vector3(), _vc = new THREE.Vector3();
const _m4 = new THREE.Matrix4(), _col = new THREE.Color();

function buildVoxels() {
  vSeed = 777;                       /* constant seed -> stable sampling */
  const cells = new Map();
  sourceRoot.updateMatrixWorld(true);
  sourceRoot.traverse((obj) => {
    if (!obj.isMesh) return;
    const isOutline = !!obj.userData.isOutline;
    const geom = obj.geometry;
    const pos = geom.attributes.position;
    const idx = geom.index;
    let r = 1, g = 1, b = 1;
    if (isOutline) { r = 0.055; g = 0.07; b = 0.13; }   /* dark-navy contour voxels */
    else if (obj.material.color) { r = obj.material.color.r; g = obj.material.color.g; b = obj.material.color.b; }
    if (obj.material.emissive) {
      const e = obj.material.emissive, ei = obj.material.emissiveIntensity || 1;
      r = Math.min(1, r + e.r * ei); g = Math.min(1, g + e.g * ei); b = Math.min(1, b + e.b * ei);
    }
    const packed = (Math.round(r * 255) << 16) | (Math.round(g * 255) << 8) | Math.round(b * 255);
    const tris = idx ? idx.count / 3 : pos.count / 3;
    for (let t = 0; t < tris; t++) {
      const i0 = idx ? idx.getX(t * 3)     : t * 3;
      const i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
      const i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
      _va.fromBufferAttribute(pos, i0).applyMatrix4(obj.matrixWorld);
      _vb.fromBufferAttribute(pos, i1).applyMatrix4(obj.matrixWorld);
      _vc.fromBufferAttribute(pos, i2).applyMatrix4(obj.matrixWorld);
      const abx = _vb.x - _va.x, aby = _vb.y - _va.y, abz = _vb.z - _va.z;
      const acx = _vc.x - _va.x, acy = _vc.y - _va.y, acz = _vc.z - _va.z;
      const cx = aby * acz - abz * acy, cy = abz * acx - abx * acz, cz = abx * acy - aby * acx;
      const area = 0.5 * Math.sqrt(cx * cx + cy * cy + cz * cz);
      if (area < 1e-9) continue;
      const dens = isOutline ? 3.6 : (obj.userData.voxDens || 1.6);
    const n = Math.max(3, Math.ceil(area / (VOX * VOX) * dens));
      for (let s = 0; s < n; s++) {
        let u = rndV(), v = rndV();
        if (u + v > 1) { u = 1 - u; v = 1 - v; }
        const w = 1 - u - v;
        const px = _va.x * w + _vb.x * u + _vc.x * v;
        const py = _va.y * w + _vb.y * u + _vc.y * v;
        const pz = _va.z * w + _vb.z * u + _vc.z * v;
        const ix = Math.floor((px - BMIN.x) / VOX);
        const iy = Math.floor((py - BMIN.y) / VOX);
        const iz = Math.floor((pz - BMIN.z) / VOX);
        if (ix < 0 || iy < 0 || iz < 0 || ix >= NX || iy >= NY || iz >= NZ) continue;
        cells.set((ix * NY + iy) * NZ + iz, packed);
      }
    }
  });
  /* cheap top-light AO: shaded if covered from above, brightened if exposed */
  const NYZ = NZ;  /* stride within a column */
  const shaded = new Map();
  cells.forEach((col, key) => {
    const iy = Math.floor(key / NZ) % NY;
    const ix = Math.floor(key / (NZ * NY));
    const iz = key % NZ;
    const above = (ix * NY + (iy + 1)) * NZ + iz;
    const rr = (col >> 16) & 255, gg = (col >> 8) & 255, bb = col & 255;
    let f = 1;
    if (cells.has(above) && iy + 1 < NY) f = 0.84;
    else f = 1.0;
    shaded.set(key, (Math.min(255, Math.round(rr * f)) << 16) |
                    (Math.min(255, Math.round(gg * f)) << 8) |
                     Math.min(255, Math.round(bb * f)));
  });
  /* fake GI: voxels facing the fire (z < -0.6 band) pick up cyan bounce */
  let i = 0;
  shaded.forEach((col, key) => {
    if (i >= MAXV) return;
    const iz = key % NZ;
    const iy = Math.floor(key / NZ) % NY;
    const ix = Math.floor(key / (NZ * NY));
    const wz = BMIN.z + (iz + 0.5) * VOX;
    const wy = BMIN.y + (iy + 0.5) * VOX;
    let rr = (col >> 16) & 255, gg = (col >> 8) & 255, bb = col & 255;
    const isContour = rr < 40 && gg < 45 && bb < 60;   /* keep contours dark */
    if (!isContour && wy < 2.6) {
      /* smooth falloff: full kiss at z=-1.6, fading to zero by z=0.2 */
      const k = Math.max(0, Math.min(1, (-wz + 0.2) / 1.8));
      if (k > 0.01) {
        const kk = k * k;
        rr = Math.min(255, rr * (1 - 0.25 * kk));
        gg = Math.min(255, gg + 22 * kk);
        bb = Math.min(255, bb * (1 + 0.12 * kk) + 18 * kk);
      }
    }
    _m4.makeTranslation(BMIN.x + (ix + 0.5) * VOX, wy, wz);
    voxMesh.setMatrixAt(i, _m4);
    voxMesh.setColorAt(i, _col.setRGB(rr / 255, gg / 255, bb / 255));
    i++;
  });
  voxMesh.count = i;
  voxMesh.instanceMatrix.needsUpdate = true;
  if (voxMesh.instanceColor) voxMesh.instanceColor.needsUpdate = true;
  return i;
}

/* ── pixel pass: posterize at internal res, 3x upscale ── */
const small = document.createElement("canvas");
small.width = LW; small.height = LH;
const sctx = small.getContext("2d", { willReadFrequently: true });
const pc = document.getElementById("pixel");
const pctx = pc.getContext("2d");

/* despeckle: kill isolated single-pixel outliers in the low-res frame */
const work = document.createElement("canvas");
work.width = LW; work.height = LH;
const wctx = work.getContext("2d", { willReadFrequently: true });
function despeckle(img) {
  const d = img.data, W = img.width, H = img.height;
  const out = new Uint8ClampedArray(d);
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = (y * W + x) * 4;
      const l = (x - 1) * 4, r = (x + 1) * 4, u = ((y - 1) * W + x) * 4, dn = ((y + 1) * W + x) * 4;
      for (let c = 0; c < 3; c++) {
        const v = d[i + c];
        const n1 = d[l + c], n2 = d[r + c], n3 = d[u + c], n4 = d[dn + c];
        /* if this pixel is an isolated spike vs all 4 neighbours, pull to their mean */
        const mean = (n1 + n2 + n3 + n4) / 4;
        if (Math.abs(v - mean) > 90 &&
            Math.abs(v - n1) > 60 && Math.abs(v - n2) > 60 &&
            Math.abs(v - n3) > 60 && Math.abs(v - n4) > 60) {
          out[i + c] = mean;
        }
      }
    }
  }
  return out;
}
function present() {
  wctx.clearRect(0, 0, LW, LH);
  wctx.drawImage(renderer.domElement, 0, 0, LW, LH);
  const img = wctx.getImageData(0, 0, LW, LH);
  img.data.set(despeckle(img));
  wctx.putImageData(img, 0, 0);
  pctx.imageSmoothingEnabled = false;
  pctx.clearRect(0, 0, pc.width, pc.height);
  pctx.drawImage(work, 0, 0, LW, LH, 0, 0, pc.width, pc.height);
}

/* rising ember sparks (voxelized with everything else) */
const sparks = [];
for (let i = 0; i < 14; i++) {
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.09),
    new THREE.MeshBasicMaterial({ color: i % 3 === 0 ? 0xeaffff : 0x7fe0ff }));
  sourceRoot.add(sp);
  sparks.push({ mesh: sp, x: -1.9 + (i * 0.31) % 3.8, ph: (i * 0.618) % 1, v: 0.5 + (i % 4) * 0.22 });
}

/* ── deterministic pose ── */
function setPhase(p) {
  const t = p * Math.PI * 2;
  const legs = [["legFR", 0], ["legBL", 0], ["legFL", Math.PI], ["legBR", Math.PI]];
  for (const [name, ph] of legs) {
    const s = Math.sin(t + ph);
    rig[name + "_hip"].rotation.x = s * 0.85;
    rig[name + "_knee"].rotation.x = Math.max(0, -Math.sin(t + ph - 0.7)) * 1.35;
  }
  rig.root.position.y = Math.abs(Math.sin(t * 2)) * 0.12;
  rig.root.rotation.y = Math.sin(t) * 0.16;
  rig.headC.rotation.x = Math.sin(t * 2) * 0.08;
  rig.headL.rotation.y = Math.sin(t + 1) * 0.1;
  rig.headR.rotation.y = Math.sin(t + 2) * 0.1;
  rig.tail.rotation.y = Math.sin(t) * 0.4;
  rig.tail.rotation.x = 0.25 + Math.sin(t * 2) * 0.08;
  const fl = 0.75 + 0.25 * Math.sin(t * 3.1) + 0.12 * Math.sin(t * 7.3);
  fireLight.intensity = 26 * fl;
  rig.fireGlow.material.opacity = 0.22 + 0.2 * fl;
  tongues.forEach((tg, i) => {
    const f = 0.8 + 0.35 * Math.sin(t * 2.7 + i * 1.9);
    tg.scale.set(0.85 + 0.2 * Math.sin(t * 3 + i), f, 0.85 + 0.2 * Math.cos(t * 2.2 + i));
    tg.rotation.z = Math.sin(t * 2 + i * 2.3) * 0.14;
  });

  /* voxel pass: animate rig -> voxelize -> hide source -> render voxels */
  /* sparks rise from the fire line */
  for (const s of sparks) {
    const life = (p + s.ph) % 1;
    s.mesh.position.set(s.x + Math.sin((p + s.ph) * 12.6) * 0.14, 0.1 + life * 3.4, -1.9 + Math.sin(s.ph * 9.4) * 0.5);
    s.mesh.visible = life > 0.03 && life < 0.9;
  }
  const count = buildVoxels();
  sourceRoot.visible = false;
  composer.render();
  sourceRoot.visible = true;
  present();
  return count;
}

window.__forge = { setPhase, rig, LW, LH };
const n0 = setPhase(0);
document.title = "FORGE ready";
console.log("voxels frame0:", n0);
</script>
